<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareerAgent</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8;
            --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --line:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    h1 { margin:0; font-size:20px; } h1 span { color:var(--accent); }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    main { max-width:980px; margin:0 auto; padding:24px; display:grid; gap:18px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    textarea { width:100%; resize:vertical; background:var(--card); color:var(--fg);
      border:1px solid var(--line); border-radius:8px; padding:12px; font:13px/1.5 ui-monospace, monospace; }
    #resume { min-height:170px; }
    button { background:var(--accent); color:#06283d; border:0; border-radius:8px;
      padding:11px 20px; font-weight:600; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line);
      padding:5px 11px; font-size:13px; font-weight:600; }
    button.ghost:disabled { color:var(--muted); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
    details > summary { cursor:pointer; font-size:14px; color:var(--fg); list-style:none; }
    details > summary::-webkit-details-marker { display:none; }
    details > summary::before { content:"▸ "; color:var(--accent); }
    details[open] > summary::before { content:"▾ "; }
    .jd-head { display:flex; justify-content:space-between; align-items:center; margin:14px 0 6px; }
    .jd-head label { margin:0; }
    .jd-slot { margin-bottom:10px; }
    .jd-slot-head { display:flex; gap:8px; margin-bottom:6px; }
    .jd-label { flex:1; background:var(--card); color:var(--fg); border:1px solid var(--line);
      border-radius:8px; padding:7px 10px; font:13px system-ui, sans-serif; }
    .jd-remove { background:transparent; color:var(--muted); border:1px solid var(--line);
      border-radius:8px; padding:0 11px; font-size:14px; cursor:pointer; }
    .jd-slot textarea { min-height:130px; }

    .chat { display:flex; flex-direction:column; gap:12px; min-height:120px; }
    .msg { max-width:86%; padding:10px 14px; border-radius:12px; }
    .msg.user { align-self:flex-end; background:#0b3a52; }
    .msg.assistant { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
    .msg .role { font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
    .msg .body { white-space:pre-wrap; }
    .msg.assistant .body { white-space:normal; }
    .composer-wrap { position:relative; }
    .composer { display:flex; gap:10px; align-items:flex-end; }
    .composer textarea { min-height:52px; font:14px/1.5 system-ui, sans-serif; }
    .slash-hint { position:absolute; bottom:100%; left:0; right:0; margin-bottom:8px; z-index:5;
      background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px;
      max-height:260px; overflow:auto; box-shadow:0 8px 24px rgba(0,0,0,.35); }
    .slash-item { display:flex; gap:10px; align-items:baseline; padding:8px 10px; border-radius:8px; cursor:pointer; }
    .slash-item:hover { background:#0b3a52; }
    .slash-item code { color:var(--accent); font:13px ui-monospace, monospace; }
    .slash-item .desc { color:var(--muted); font-size:12px; }
    .hint { color:var(--muted); font-size:12px; }
    .trace-toggle { cursor:pointer; color:var(--accent); font-size:12px; margin-top:8px; user-select:none; }
    .trace-step { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0 0; }
    .trace-step .th { font-size:13px; margin-bottom:5px; }
    .trace-step .act { color:var(--accent); font:12px/1.5 ui-monospace, monospace; word-break:break-word; }
    .trace-step .obs { color:var(--muted); font-size:12px; margin-top:5px; white-space:pre-wrap; }

    pre { white-space:pre-wrap; background:#0b1220; border:1px solid var(--line); border-radius:8px;
      padding:14px; font:12px/1.55 ui-monospace, monospace; overflow-x:auto; }
    .md h1 { font-size:18px; margin:14px 0 8px; }
    .md h2 { font-size:15px; margin:14px 0 6px; color:var(--accent); }
    .md h3 { font-size:12px; margin:10px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .md p { margin:8px 0; }
    .md ul { margin:6px 0; padding-left:20px; } .md li { margin:2px 0; }
    .md table { border-collapse:collapse; width:100%; margin:8px 0; font-size:12px; }
    .md th, .md td { border:1px solid var(--line); padding:5px 8px; text-align:left; }
    .md th { background:#0b1220; }
    .md code { background:#0b1220; padding:1px 4px; border-radius:4px; font:12px ui-monospace, monospace; }
    .md hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
    .md em { color:var(--muted); }
    .muted { color:var(--muted); } .err { color:var(--bad); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Career<span>Agent</span></h1>
      <div class="sub">Chat with the ReAct agent over your resume + JD(s). Try <code>/match</code>, <code>/report</code>, <code>/prep</code>, <code>/audit</code>, <code>/compare</code>, or just ask.</div>
    </div>
    <button id="reset" class="ghost" type="button">New chat</button>
  </header>

  <main>
    <details id="context" class="card" open>
      <summary>Context — resume &amp; job description(s)</summary>
      <div class="grid" style="margin-top:14px;">
        <div>
          <label for="resume">Resume</label>
          <textarea id="resume" placeholder="Paste the resume text..."></textarea>
        </div>
        <div>
          <div class="jd-head">
            <label>Job description(s)</label>
            <button id="add-jd" class="ghost" type="button">+ Add JD</button>
          </div>
          <div id="jd-list"></div>
        </div>
      </div>
      <div class="hint" style="margin-top:6px;">Edit anytime — changes apply on your next message. Add a second JD to compare roles.</div>
    </details>

    <div id="chat" class="chat"></div>

    <div class="composer-wrap">
      <div id="slash-hint" class="slash-hint hidden"></div>
      <div class="composer">
        <textarea id="msg" placeholder="Ask a question, or type a /command…"></textarea>
        <button id="send">Send</button>
      </div>
    </div>
    <div id="status" class="hint"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const MAX_JDS = 3;
    let sessionId = null;
    let lastContext = null;

    // ── Multi-JD slots ────────────────────────────────────────────────
    function jdSlotCount() { return $("jd-list").querySelectorAll(".jd-slot").length; }

    function addJdSlot() {
      const i = jdSlotCount();
      if (i >= MAX_JDS) return;
      const slot = document.createElement("div");
      slot.className = "jd-slot";
      const letter = String.fromCharCode(65 + i);
      slot.innerHTML = `
        <div class="jd-slot-head">
          <input class="jd-label" placeholder="Job ${letter} (optional label)" />
          <button class="jd-remove" type="button" title="Remove this JD">✕</button>
        </div>
        <textarea class="jd-text" placeholder="Paste the JD text..."></textarea>`;
      slot.querySelector(".jd-remove").addEventListener("click", () => { slot.remove(); refreshJdControls(); });
      $("jd-list").appendChild(slot);
      refreshJdControls();
    }
    function refreshJdControls() {
      const slots = $("jd-list").querySelectorAll(".jd-slot");
      slots.forEach((s, idx) => { s.querySelector(".jd-remove").style.visibility = idx === 0 ? "hidden" : "visible"; });
      $("add-jd").disabled = slots.length >= MAX_JDS;
    }
    function getJds() {
      return [...$("jd-list").querySelectorAll(".jd-slot")].map((s) => ({
        label: s.querySelector(".jd-label").value.trim(),
        text: s.querySelector(".jd-text").value.trim(),
      })).filter((j) => j.text);
    }

    // ── Chat ──────────────────────────────────────────────────────────
    function currentContext() { return { resume_text: $("resume").value.trim(), jds: getJds() }; }

    async function send() {
      const message = $("msg").value.trim();
      if (!message) return;
      const ctx = currentContext();
      if (!sessionId && (!ctx.resume_text || !ctx.jds.length)) {
        setStatus("Add a resume and at least one JD to start.", true); return;
      }

      const payload = { message };
      if (sessionId) payload.session_id = sessionId;
      // Send context on the first turn, or whenever it changed since last send.
      const ctxKey = JSON.stringify(ctx);
      if (!sessionId || ctxKey !== lastContext) {
        payload.resume_text = ctx.resume_text;
        if (ctx.jds.length === 1) payload.jd_text = ctx.jds[0].text;
        else if (ctx.jds.length > 1) payload.jds = ctx.jds.map((j) => (j.label ? { text: j.text, label: j.label } : { text: j.text }));
        lastContext = ctxKey;
      }

      appendMsg("user", message);
      $("msg").value = "";
      hideSlashHint();
      $("send").disabled = true;
      setStatus("Working…");

      // A live assistant bubble: shows steps as they stream, then the reply
      // typed out token-by-token.
      const live = appendMsg("assistant", "");
      const liveBody = live.querySelector(".body");
      liveBody.innerHTML = '<span class="muted">…</span>';
      const liveTrace = document.createElement("div");
      live.appendChild(liveTrace);
      const steps = [];
      let answer = "";

      try {
        const res = await fetch("/api/v1/career/chat/stream", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        });
        if (!res.ok) {
          let msg = "Request failed (" + res.status + ")";
          try { const b = await res.json(); if (b.error) msg = b.error.message; } catch (_) {}
          throw new Error(msg);
        }
        let done = null;
        await readSSE(res, (event, data) => {
          if (event === "step") {
            steps.push(data);
            if (!answer) liveBody.innerHTML = `<span class="muted">thinking… (${steps.length} step${steps.length > 1 ? "s" : ""})</span>`;
            liveTrace.innerHTML = renderSteps(steps);
            live.scrollIntoView({ behavior: "smooth", block: "end" });
          } else if (event === "token") {
            answer += data.text;
            liveBody.className = "body";       // plain text while typing
            liveBody.textContent = answer;
            live.scrollIntoView({ behavior: "smooth", block: "end" });
          } else if (event === "done") {
            done = data;
          }
        });
        if (!done) throw new Error("No response from the server.");
        sessionId = done.session_id;
        liveBody.className = "body md";
        liveBody.innerHTML = renderMarkdown(done.reply);
        liveTrace.remove();
        if (steps.length) attachTrace(live, steps);
        setStatus(done.state === "awaiting_user" ? "The agent asked a question — reply below to continue." : "");
        if ($("context").open) $("context").open = false; // tuck the context away once chatting
      } catch (e) {
        live.remove();
        setStatus(e.message, true);
      } finally {
        $("send").disabled = false; $("msg").focus();
      }
    }

    // Parse a Server-Sent Events stream, calling onEvent(event, dataObj) per message.
    async function readSSE(res, onEvent) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          let ev = "message", data = "";
          for (const line of chunk.split("\n")) {
            if (line.startsWith("event:")) ev = line.slice(6).trim();
            else if (line.startsWith("data:")) data += line.slice(5).trim();
          }
          if (data) { try { onEvent(ev, JSON.parse(data)); } catch (_) {} }
        }
      }
    }

    function appendMsg(role, content) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      const body = role === "assistant" ? `<div class="body md">${renderMarkdown(content)}</div>`
                                        : `<div class="body">${escapeHtml(content)}</div>`;
      el.innerHTML = `<div class="role">${role === "assistant" ? "agent" : "you"}</div>${body}`;
      $("chat").appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "end" });
      return el;
    }

    function renderSteps(steps) {
      return steps.map((s) => `
        <div class="trace-step">
          ${s.thought ? `<div class="th">${escapeHtml(s.thought)}</div>` : ""}
          ${s.action ? `<div class="act">→ ${escapeHtml(s.action)} ${escapeHtml(JSON.stringify(s.action_input || {}))}</div>` : ""}
          ${s.observation ? `<div class="obs">${escapeHtml(s.observation)}</div>` : ""}
        </div>`).join("");
    }

    function attachTrace(msgEl, steps) {
      const toggle = document.createElement("div");
      toggle.className = "trace-toggle";
      const label = (open) => `${open ? "▾" : "▸"} reasoning (${steps.length} step${steps.length > 1 ? "s" : ""})`;
      toggle.textContent = label(false);
      const trace = document.createElement("div");
      trace.className = "hidden";
      trace.innerHTML = renderSteps(steps);
      toggle.addEventListener("click", () => { const hidden = trace.classList.toggle("hidden"); toggle.textContent = label(!hidden); });
      msgEl.appendChild(toggle); msgEl.appendChild(trace);
    }

    // ── Slash-command hint ────────────────────────────────────────────
    const SLASH = [
      ["/match", "score the resume against the JD"],
      ["/report", "full match report"],
      ["/prep", "interview prep (optional: role, difficulty)"],
      ["/audit", "flag unsupported / exaggerated claims"],
      ["/compare", "rank multiple JDs"],
      ["/help", "list commands"],
    ];
    function hideSlashHint() { $("slash-hint").classList.add("hidden"); }
    function updateSlashHint() {
      const v = $("msg").value;
      const hint = $("slash-hint");
      if (!v.startsWith("/") || /[\s\n]/.test(v)) { hideSlashHint(); return; }
      const q = v.slice(1).toLowerCase();
      const matches = SLASH.filter(([c]) => c.slice(1).startsWith(q));
      if (!matches.length) { hideSlashHint(); return; }
      hint.innerHTML = matches.map(([c, d]) =>
        `<div class="slash-item" data-cmd="${c}"><code>${c}</code><span class="desc">${d}</span></div>`).join("");
      hint.querySelectorAll(".slash-item").forEach((el) => el.addEventListener("mousedown", (e) => {
        e.preventDefault();
        $("msg").value = el.dataset.cmd + " ";
        hideSlashHint(); $("msg").focus();
      }));
      hint.classList.remove("hidden");
    }

    function resetChat() {
      sessionId = null; lastContext = null;
      $("chat").innerHTML = "";
      $("context").open = true;
      setStatus("New chat — current resume/JD will seed it.");
    }

    function setStatus(msg, isErr) { const el = $("status"); el.textContent = msg || ""; el.className = isErr ? "err" : "hint"; }

    // ── Minimal Markdown → HTML (headings, bold/italic/code, lists, tables) ──
    function mdInline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>");
    }
    function mdRow(line) { return line.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim()); }
    function renderMarkdown(md) {
      const lines = String(md).split("\n");
      const isSep = (s) => s !== undefined && /^\s*\|?[\s:|-]*-{2,}[\s:|-]*$/.test(s);
      let html = "", i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (/^\s*$/.test(line)) { i++; continue; }
        if (/^\s*-{3,}\s*$/.test(line)) { html += "<hr>"; i++; continue; }
        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) { const n = h[1].length; html += `<h${n}>${mdInline(h[2])}</h${n}>`; i++; continue; }
        if (line.includes("|") && isSep(lines[i + 1])) {
          const head = mdRow(line); i += 2; const rows = [];
          while (i < lines.length && lines[i].includes("|") && !/^\s*$/.test(lines[i])) { rows.push(mdRow(lines[i])); i++; }
          html += "<table><thead><tr>" + head.map((c) => `<th>${mdInline(c)}</th>`).join("") + "</tr></thead><tbody>";
          html += rows.map((r) => "<tr>" + r.map((c) => `<td>${mdInline(c)}</td>`).join("") + "</tr>").join("");
          html += "</tbody></table>"; continue;
        }
        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
          html += "<ul>" + items.map((it) => `<li>${mdInline(it)}</li>`).join("") + "</ul>"; continue;
        }
        const para = [];
        while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*#{1,6}\s/.test(lines[i]) &&
               !/^\s*-{3,}\s*$/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) &&
               !(lines[i].includes("|") && isSep(lines[i + 1]))) { para.push(lines[i]); i++; }
        html += `<p>${mdInline(para.join(" "))}</p>`;
      }
      return html;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    $("send").addEventListener("click", send);
    $("reset").addEventListener("click", () => { hideSlashHint(); resetChat(); });
    $("add-jd").addEventListener("click", addJdSlot);
    // Enter sends; Shift+Enter inserts a newline. Ignore Enter while an IME is
    // composing (e.g. selecting a Chinese candidate) — otherwise the send races
    // the composition commit and the box looks like it didn't clear.
    $("msg").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault(); send();
      }
    });
    $("msg").addEventListener("input", updateSlashHint);
    // Hide the hint on blur, but after a click on an item can register.
    $("msg").addEventListener("blur", () => setTimeout(hideSlashHint, 150));
    addJdSlot(); // seed the first JD slot
  </script>
</body>
</html>
