<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareerAgent</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8;
            --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --line:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:20px 24px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:20px; } h1 span { color:var(--accent); }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    main { max-width:980px; margin:0 auto; padding:24px; display:grid; gap:20px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    textarea { width:100%; min-height:200px; resize:vertical; background:var(--card);
      color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:12px; font:13px/1.5 ui-monospace, monospace; }
    button { background:var(--accent); color:#06283d; border:0; border-radius:8px;
      padding:11px 20px; font-weight:600; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
    .card h2 { margin:0 0 12px; font-size:15px; }
    .score { font-size:34px; font-weight:700; }
    .rating { font-size:13px; color:var(--muted); }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); }
    .chip.ok { color:var(--ok); border-color:#14532d; }
    .chip.bad { color:var(--bad); border-color:#7f1d1d; }
    .rel { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .rel:last-child { border-bottom:0; }
    .bar { height:6px; background:#0b1220; border-radius:4px; overflow:hidden; margin-top:2px; }
    .bar > i { display:block; height:100%; background:var(--accent); }
    .finding { font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); }
    .finding:last-child { border-bottom:0; }
    .sev { font-size:11px; text-transform:uppercase; font-weight:700; margin-right:6px; }
    .sev.high{color:var(--bad);} .sev.medium{color:var(--warn);} .sev.low{color:var(--muted);}
    pre { white-space:pre-wrap; background:#0b1220; border:1px solid var(--line); border-radius:8px;
      padding:14px; font:12px/1.55 ui-monospace, monospace; overflow-x:auto; }
    .muted { color:var(--muted); } .err { color:var(--bad); }
    .hidden { display:none; }
    #results { display:grid; gap:20px; }
    #results.hidden { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>Career<span>Agent</span></h1>
    <div class="sub">Paste a job description and a resume to get a match analysis.</div>
  </header>

  <main>
    <div class="grid">
      <div>
        <label for="jd">Job description</label>
        <textarea id="jd" placeholder="Paste the JD text..."></textarea>
      </div>
      <div>
        <label for="resume">Resume</label>
        <textarea id="resume" placeholder="Paste the resume text..."></textarea>
      </div>
    </div>
    <div>
      <button id="run">Analyze</button>
      <span id="status" class="muted" style="margin-left:12px;"></span>
    </div>

    <div id="results" class="hidden">
      <div class="card">
        <h2>Overall</h2>
        <div class="score" id="score">–</div>
        <div class="rating" id="rating"></div>
      </div>
      <div class="grid">
        <div class="card"><h2>Matched skills</h2><div class="chips" id="matched"></div></div>
        <div class="card"><h2>Missing skills</h2><div class="chips" id="missing"></div></div>
      </div>
      <div class="card"><h2>Most relevant experience</h2><div id="relevance"></div></div>
      <div class="card"><h2>Risk audit</h2><div id="audit"></div></div>
      <div class="card"><h2>Report</h2><pre id="report"></pre></div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    async function analyze() {
      const jd = $("jd").value.trim();
      const resume = $("resume").value.trim();
      if (!jd || !resume) { setStatus("Enter both a job description and a resume.", true); return; }

      $("run").disabled = true;
      setStatus("Analyzing… (parsing, matching, auditing, generating report)");
      try {
        const res = await fetch("/api/v1/career-match", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jd_text: jd, resume_text: resume }),
        });
        const body = await res.json();
        if (!res.ok || body.status === "error") {
          throw new Error(body.error ? body.error.message : "Request failed (" + res.status + ")");
        }
        render(body.data);
        setStatus("Done.");
      } catch (e) {
        setStatus(e.message, true);
      } finally {
        $("run").disabled = false;
      }
    }

    function setStatus(msg, isErr) {
      const el = $("status");
      el.textContent = msg;
      el.className = isErr ? "err" : "muted";
    }

    function chips(container, items, cls) {
      container.innerHTML = items.length
        ? items.map((s) => `<span class="chip ${cls}">${escapeHtml(s)}</span>`).join("")
        : '<span class="muted">none</span>';
    }

    function render(data) {
      const report = data.report, match = data.match;
      $("results").classList.remove("hidden");

      $("score").textContent = report.overall_score.toFixed(2) + " / 1.00";
      $("rating").textContent = report.overall_rating + " — " + report.skill_summary;

      chips($("matched"), report.matched_skills, "ok");
      chips($("missing"), report.missing_skills, "bad");

      const rel = match.project_relevance || [];
      $("relevance").innerHTML = rel.length
        ? rel.map((r) => `
            <div class="rel"><span>${escapeHtml(r.label)}</span><span>${r.normalized_score.toFixed(2)}</span></div>
            <div class="bar"><i style="width:${Math.round(r.normalized_score * 100)}%"></i></div>`).join("")
        : '<span class="muted">No ranked experiences.</span>';

      const audit = match.project_audit || { findings: [], summary: "", advice: "" };
      let html = `<div class="muted" style="margin-bottom:8px;">${escapeHtml(audit.summary || "")}</div>`;
      html += (audit.findings || []).map((f) => `
        <div class="finding"><span class="sev ${f.severity}">${f.severity}</span>
        ${escapeHtml(f.subject)} — ${escapeHtml(f.detail)}</div>`).join("");
      if (audit.advice) html += `<pre style="margin-top:10px;">${escapeHtml(audit.advice)}</pre>`;
      $("audit").innerHTML = html || '<span class="muted">No risks detected.</span>';

      $("report").textContent = report.full_report || "";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    $("run").addEventListener("click", analyze);
  </script>
</body>
</html>
